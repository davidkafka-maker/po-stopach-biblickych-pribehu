<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Po stopách biblických příběhů</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --night:#120911;
      --wine:#7f1426;
      --wine2:#a01f34;
      --gold:#f0bd56;
      --paper:#fff6e4;
      --ink:#261016;
      --blue:#1265d8;
      --red:#c51f2f;
      --green:#188a3c;
      --shadow:rgba(0,0,0,.45);
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      padding:14px;
      font-family: Georgia, "Times New Roman", serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(240,189,86,.34), transparent 18%),
        radial-gradient(circle at 80% 10%, rgba(255,255,255,.12), transparent 14%),
        linear-gradient(135deg, #10070d 0%, #3a101d 58%, #070408 100%);
      display:flex;
      justify-content:center;
      align-items:stretch;
    }
    .app {
      width:min(1040px,100%);
      min-height:calc(100vh - 28px);
      background:
        linear-gradient(rgba(255,246,228,.94), rgba(255,246,228,.96)),
        repeating-linear-gradient(45deg, rgba(127,20,38,.04), rgba(127,20,38,.04) 8px, transparent 8px, transparent 18px);
      border:7px double var(--gold);
      border-radius:26px;
      box-shadow:0 24px 80px var(--shadow);
      padding:22px;
      position:relative;
      overflow:hidden;
    }
    .app::before {
      content:"";
      position:absolute;
      inset:14px;
      border:1px solid rgba(127,20,38,.18);
      border-radius:18px;
      pointer-events:none;
    }
    h1 {
      margin:8px 0 4px;
      text-align:center;
      color:var(--wine);
      font-size:clamp(34px,5.5vw,62px);
      text-shadow:0 2px 0 rgba(240,189,86,.45);
      letter-spacing:.4px;
    }
    .subtitle {
      text-align:center;
      color:#6a303a;
      font-size:18px;
      margin:0 0 18px;
    }
    .card {
      background:rgba(255,255,255,.76);
      border:2px solid rgba(127,20,38,.22);
      border-radius:22px;
      padding:20px;
      margin:14px 0;
      box-shadow:0 10px 28px rgba(61,20,28,.12);
    }
    .startCard {
      max-width:760px;
      margin:20px auto 0;
      padding:24px;
    }
    .row {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }
    label {
      display:block;
      font-weight:bold;
      margin-bottom:7px;
      color:#4b2028;
      font-size:18px;
    }
    input {
      width:100%;
      padding:14px 15px;
      border-radius:15px;
      border:2px solid rgba(127,20,38,.36);
      font-size:19px;
      background:#fff;
      outline:none;
    }
    input:focus {
      border-color:var(--wine2);
      box-shadow:0 0 0 4px rgba(160,31,52,.14);
    }
    button, a.btn {
      cursor:pointer;
      border:0;
      border-radius:18px;
      padding:16px 24px;
      font-weight:bold;
      font-size:20px;
      color:white;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing:.3px;
      transition:transform .08s ease, filter .12s ease;
    }
    button:active, a.btn:active { transform:translateY(2px); }
    .btnTest {
      background:linear-gradient(135deg, #a71934, #6f1022);
      box-shadow:0 6px 0 #4d0b17, 0 10px 24px rgba(127,20,38,.28);
    }
    .btnTable {
      background:linear-gradient(135deg, #2d6cdf, #17408c);
      box-shadow:0 6px 0 #102c61, 0 10px 24px rgba(18,101,216,.25);
    }
    .btnMenu {
      background:linear-gradient(135deg, #7b5422, #4c3212);
      box-shadow:0 6px 0 #2e1d0a;
    }
    button:hover, a.btn:hover { filter:brightness(1.06); }
    button:disabled { opacity:.65; cursor:not-allowed; transform:none; }
    .center { text-align:center; }
    .hidden { display:none !important; }
    .startButtons {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
      margin-top:22px;
    }
    .topbar {
      display:grid;
      grid-template-columns:1fr 1.1fr 1fr;
      gap:12px;
      align-items:center;
      margin:10px 0 14px;
    }
    .pill {
      background:linear-gradient(135deg, #f8e6bd, #efd18a);
      border:1px solid rgba(127,20,38,.25);
      padding:10px 13px;
      border-radius:999px;
      color:#562730;
      font-weight:bold;
      text-align:center;
      box-shadow:0 4px 12px rgba(61,20,28,.10);
    }
    #timeText {
      font-size:clamp(22px,3.2vw,34px);
      color:#7f1426;
      padding:10px 16px;
      border:2px solid rgba(127,20,38,.34);
      text-shadow:0 2px 0 rgba(255,255,255,.55);
    }
.questionCard {
      position:relative;
      padding:24px;
      background:
        radial-gradient(circle at top left, rgba(240,189,86,.18), transparent 34%),
        rgba(255,255,255,.80);
    }
    .question {
      font-size:clamp(23px,3vw,33px);
      line-height:1.35;
      margin:8px 0 22px;
      color:#260c13;
      font-weight:bold;
      text-align:center;
    }

    .balladBadge {
      width: fit-content;
      max-width: 100%;
      margin: 0 auto 14px;
      padding: 10px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, #7f1426, #a01f34);
      color: #fff6e4;
      border: 2px solid rgba(240,189,86,.85);
      box-shadow: 0 5px 14px rgba(127,20,38,.26);
      font-weight: bold;
      font-size: clamp(18px,2.5vw,26px);
      letter-spacing: .7px;
      text-align: center;
      text-transform: uppercase;
    }
    .answers {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }
    .answer {
      min-height:92px;
      text-align:left;
      background:linear-gradient(135deg, #fffefb, #f8ead0);
      color:var(--ink);
      box-shadow:0 5px 0 rgba(127,20,38,.18), 0 9px 20px rgba(0,0,0,.08);
      border:2px solid rgba(127,20,38,.26);
      font-size:19px;
      line-height:1.25;
      padding:15px 16px;
    }

    .answer:disabled {
      opacity:1;
      cursor:default;
      filter:none;
    }

    @media (hover: hover) and (pointer: fine) {
      .answer:hover {
        border-color:var(--wine2);
        transform:translateY(-1px);
      }
    }

    .answer:focus,
    .answer:active {
      outline:none;
      transform:none;
    }

    .answer {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .answer.correctReveal {
      background:linear-gradient(135deg, #e4f0ff, #5fa1ff) !important;
      border-color:var(--blue) !important;
      color:#041f52 !important;
      box-shadow:0 5px 0 #0d4fae, 0 0 0 6px rgba(18,101,216,.20) !important;
    }
    .answer.wrongReveal {
      background:linear-gradient(135deg, #ffd1d1, #df2636) !important;
      border-color:var(--red) !important;
      color:#ffffff !important;
      box-shadow:0 5px 0 #8d1520, 0 0 0 6px rgba(197,31,47,.22) !important;
    }
    .feedback {
      margin-top:18px;
      min-height:46px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:clamp(24px,3.4vw,36px);
      font-weight:bold;
      text-align:center;
    }
    .feedback.good { color:var(--green); }
    .feedback.bad { color:var(--red); }
    .feedback.blue { color:var(--blue); }
    .result-big {
      font-size:clamp(32px,5vw,54px);
      color:var(--wine);
      font-weight:bold;
      margin:12px 0;
      text-shadow:0 2px 0 rgba(240,189,86,.45);
    }

    .resultScore {
      margin: 18px auto;
      max-width: 460px;
      padding: 18px 20px;
      border-radius: 20px;
      background: linear-gradient(135deg,#fff7d6,#f2d076);
      border: 3px solid #d2a22b;
      box-shadow: 0 9px 24px rgba(0,0,0,.16);
    }
    .resultLabel {
      font-size: 22px;
      font-weight: bold;
      color: #7f1426;
      margin-bottom: 8px;
      letter-spacing: .5px;
    }
    .resultValue {
      font-size: clamp(42px,7vw,62px);
      font-weight: bold;
      color: #1265d8;
      line-height: 1;
    }
    .resultGrade {
      font-size: clamp(54px,9vw,78px);
      font-weight: bold;
      color: #188a3c;
      line-height: 1;
    }

    .blockedMessage {
      margin-top:18px;
      padding:16px;
      border-radius:16px;
      background:#ffe1e1;
      border:3px solid var(--red);
      color:#8d1111;
      font-size:22px;
      font-weight:bold;
      text-align:center;
    }
    .checkingMessage {
      margin-top:18px;
      color:#7f1426;
      font-weight:bold;
      text-align:center;
    }

    .small { color:#684047; font-size:14px; }
    .bottomMenu {
      margin-top:22px;
      padding-top:16px;
      border-top:2px solid rgba(127,20,38,.18);
      display:flex;
      justify-content:center;
      gap:14px;
      flex-wrap:wrap;
    }
    @media(max-width:720px){
      body{padding:7px;}
      .app{padding:13px; border-width:4px;}
      .row, .startButtons, .topbar, .answers{grid-template-columns:1fr;}
      button, a.btn{width:100%;}
      .answer{font-size:17px; min-height:74px;}
      .questionCard{padding:16px;}
    }
  </style>
</head>
<body>
<div class="app">
  <h1>Po stopách biblických příběhů</h1>
  <div class="subtitle">test skutečné četby</div>

  <section id="screenStart" class="card startCard">
    <div class="row">
      <div>
        <label for="surname">Příjmení</label>
        <input id="surname" autocomplete="family-name" placeholder="např. Novák">
      </div>
      <div>
        <label for="className">Třída</label>
        <input id="className" placeholder="např. 2.A">
      </div>
    </div>

    <div class="startButtons">
      <button class="btnTest" id="startBtn" type="button">TEST</button>
      <a class="btn btnTable" href="https://docs.google.com/spreadsheets/d/1_dtTEdaPKPPNqQvlmE_LKqeoZmWMQ9w7JfCWuKyD1EA/edit?usp=sharing" target="_blank" rel="noopener">VÝSLEDKOVÁ TABULKA</a>
    </div>
    <p id="startStatus" class="small center"></p>
  </section>

  <section id="screenQuiz" class="hidden">
    <div class="topbar">
      <div class="pill" id="progress">Otázka 1/20</div>
      <div>
        <div class="pill" id="timeText">Čas: 20 s</div>
      </div>
      <div class="pill" id="score">Body: 0</div>
    </div>

    <div class="card questionCard">
      <div id="balladBadge" class="balladBadge"></div>
      <div id="question" class="question"></div>
      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback"></div>
    </div>
  </section>

  <section id="screenResult" class="card startCard hidden">
    <div class="center">
      <div class="result-big" id="finalTitle"></div>
      <div id="finalText"></div>
      <p id="sendStatus" class="small"></p>
      <div class="bottomMenu">
        <button class="btnMenu" onclick="goMenu()">HLAVNÍ MENU</button>
        <a class="btn btnTable" href="https://docs.google.com/spreadsheets/d/1_dtTEdaPKPPNqQvlmE_LKqeoZmWMQ9w7JfCWuKyD1EA/edit?usp=sharing" target="_blank" rel="noopener">VÝSLEDKOVÁ TABULKA</a>
      </div>
    </div>
  </section>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyOR9AyqAgzzHaakd0RYDdP906iyHbkNko30yWRgnmDNelQGUNq_5yTbrlNClpRo65b/exec";
const APP_NAME = "Po stopách biblických příběhů";
const TABLE_URL = "https://docs.google.com/spreadsheets/d/1_dtTEdaPKPPNqQvlmE_LKqeoZmWMQ9w7JfCWuKyD1EA/edit?usp=sharing";
const TEST_COUNT = 16;
const PASS_LIMIT = 10;
const QUESTION_TIME = 20;
const REVEAL_TIME = 2000;

const QUESTIONS = [
  {
    "q": "Koho Bůh podle biblického vyprávění stvořil jako prvního člověka?",
    "a": ["Abrahama", "Adama", "Noema", "Kaina"],
    "correct": "Adama",
    "cast": "Adam a Eva"
  },
  {
    "q": "Z čeho Bůh vytvořil Adama?",
    "a": ["Z prachu země", "Z kamene", "Z vody", "Ze světla"],
    "correct": "Z prachu země",
    "cast": "Adam a Eva"
  },
  {
    "q": "Kde Bůh nechal Adama a Evu žít?",
    "a": ["V zemi Kenaan", "V zahradě Eden", "Na hoře Ararat", "V městě Ur"],
    "correct": "V zahradě Eden",
    "cast": "Adam a Eva"
  },
  {
    "q": "Z čeho byla podle biblického příběhu vytvořena Eva?",
    "a": ["Z hlíny", "Z Adamova žebra", "Z listí stromu", "Z pramene vody"],
    "correct": "Z Adamova žebra",
    "cast": "Adam a Eva"
  },
  {
    "q": "Ze kterého stromu nesměli Adam a Eva jíst?",
    "a": ["Ze stromu života", "Ze stromu poznání dobrého a zlého", "Z fíkovníku", "Z olivovníku"],
    "correct": "Ze stromu poznání dobrého a zlého",
    "cast": "Adam a Eva"
  },
  {
    "q": "Kdo přiměl Evu pochybovat o Božím zákazu?",
    "a": ["Lev", "Had", "Anděl", "Adam"],
    "correct": "Had",
    "cast": "Adam a Eva"
  },
  {
    "q": "Co Adam a Eva udělali, když poznali, že jsou nazí?",
    "a": ["Utekli z Edenu", "Upletli si zástěrky z fíkových listů", "Požádali hada o pomoc", "Skryli se v řece"],
    "correct": "Upletli si zástěrky z fíkových listů",
    "cast": "Adam a Eva"
  },
  {
    "q": "Co střežilo cestu ke stromu života po vyhnání lidí z Edenu?",
    "a": ["Dva lvi", "Cherubové a plamenný meč", "Vysoká zeď", "Had"],
    "correct": "Cherubové a plamenný meč",
    "cast": "Adam a Eva"
  },
  {
    "q": "Jaké povolání měl Ábel?",
    "a": ["Byl rolníkem", "Byl pastýřem ovcí", "Byl lovcem", "Byl stavitelem"],
    "correct": "Byl pastýřem ovcí",
    "cast": "Kain a Ábel"
  },
  {
    "q": "Jaké povolání měl Kain?",
    "a": ["Obdělával půdu", "Pásl ovce", "Lovil zvěř", "Vyráběl stany"],
    "correct": "Obdělával půdu",
    "cast": "Kain a Ábel"
  },
  {
    "q": "Jak Kain reagoval, když Bůh shlédl na Ábelovu oběť, ale na jeho oběť ne?",
    "a": ["Rozhněval se a jeho tvář se zachmuřila", "Požádal Ábela, aby mu poradil", "Odešel do jiné země", "Přinesl okamžitě novou oběť"],
    "correct": "Rozhněval se a jeho tvář se zachmuřila",
    "cast": "Kain a Ábel"
  },
  {
    "q": "Kam Kain vylákal svého bratra Ábela?",
    "a": ["Do města", "Na pole", "K řece", "Na horu"],
    "correct": "Na pole",
    "cast": "Kain a Ábel"
  },
  {
    "q": "Co Kain Ábelovi udělal?",
    "a": ["Vyhnal ho z domova", "Zabil ho", "Prodal ho do otroctví", "Okradl ho o stádo"],
    "correct": "Zabil ho",
    "cast": "Kain a Ábel"
  },
  {
    "q": "Jak Kain odpověděl Bohu na otázku, kde je Ábel?",
    "a": ["Ábel odešel do jiné země", "Nevím; cožpak jsem strážcem svého bratra?", "Ábel hlídá stádo", "Ábel se přede mnou ukryl"],
    "correct": "Nevím; cožpak jsem strážcem svého bratra?",
    "cast": "Kain a Ábel"
  },
  {
    "q": "Co podle Božích slov volalo ze země?",
    "a": ["Ábelova krev", "Kainova oběť", "Hlas anděla", "Úroda z pole"],
    "correct": "Ábelova krev",
    "cast": "Kain a Ábel"
  },
  {
    "q": "Jak Bůh Kaina ochránil před zabitím?",
    "a": ["Dal mu neproniknutelné brnění", "Učinil na něm znamení", "Poslal s ním anděla", "Ukryl ho v Edenu"],
    "correct": "Učinil na něm znamení",
    "cast": "Kain a Ábel"
  },
  {
    "q": "Proč se Bůh rozhodl seslat na zemi potopu?",
    "a": ["Lidé přestali stavět města", "Země byla plná lidské zkaženosti a násilí", "Lidé nechtěli chovat zvířata", "Noe opustil svou rodinu"],

  {
    "q": "Čím měl Noe podle Božího příkazu natřít archu uvnitř i zvenčí?",

    "correct": "Smolou (asfaltem)",
    "cast": "Noe"
  },
  {
    "q": "Kolik synů měl Noe?",
    "a": ["Dva", "Tři", "Čtyři", "Sedm"],
    "correct": "Tři",
    "cast": "Noe"
  },
  {
    "q": "Jak se jmenovali Noemovi synové?",
    "a": ["Šém, Chám a Jefet", "Kain, Ábel a Šét", "Abraham, Izák a Jákob", "Rúben, Lévi a Juda"],
    "correct": "Šém, Chám a Jefet",
    "cast": "Noe"
  },
  {
    "q": "Jak dlouho podle biblického vyprávění pršelo při potopě?",
    "a": ["Sedm dní a nocí", "Čtyřicet dní a čtyřicet nocí", "Sto dní", "Jeden rok"],
    "correct": "Čtyřicet dní a čtyřicet nocí",
    "cast": "Noe"
  },
  {
    "q": "Na jakém pohoří archa spočinula?",

  {

  },
  {
    "q": "Jaké znamení dal Bůh jako připomínku smlouvy po potopě?",
    "a": ["Hvězdu", "Duhu", "Ohnivý sloup", "Olivovník"],
    "correct": "Duhu",
    "cast": "Noe"
  },
  {
    "q": "Kde se lidé usadili před stavbou babylonské věže?",
    "a": ["V údolí Jordánu", "V zemi Šineáru", "V Egyptě", "V Kenaanu"],
    "correct": "V zemi Šineáru",
    "cast": "Babylonská věž"
  },
  {
    "q": "Jakým jazykem podle příběhu původně mluvila celá země?",
    "a": ["Hebrejsky", "Jednou řečí a stejnými slovy", "Egyptsky", "Každý národ jiným jazykem"],
    "correct": "Jednou řečí a stejnými slovy",
    "cast": "Babylonská věž"
  },
  {
    "q": "Z čeho lidé stavěli město a věž?",
    "a": ["Z opracovaných kamenů a vápna", "Z cihel spojovaných asfaltem", "Ze dřeva a hlíny", "Z mramoru"],
    "correct": "Z cihel spojovaných asfaltem",
    "cast": "Babylonská věž"
  },
  {
    "q": "Proč chtěli lidé vybudovat město a věž?",
    "a": ["Aby si učinili jméno a nebyli rozptýleni po zemi", "Aby se ukryli před další potopou", "Aby v ní uctívali Noema", "Aby mohli pozorovat hvězdy"],

    "cast": "Babylonská věž"

  {
    "q": "Co Bůh podle vyprávění sestoupil spatřit?",
    "a": ["Archu na Araratu", "Město a věž, které lidé budovali", "Abrahamův stan", "Zahradu Eden"],
    "correct": "Město a věž, které lidé budovali",
    "cast": "Babylonská věž"
  },
  {
    "q": "Jak měla podle záměru stavitelů vypadat jejich věž?",

    "cast": "Babylonská věž"
  },
  {
    "q": "Jak Bůh zastavil společné dílo stavitelů?",

let quiz = [];
let index = 0;
let points = 0;
let locked = false;
let started = false;
let finished = false;
let cheatTimer = null;
let timeLeft = QUESTION_TIME;
let timerInterval = null;
let revealTimeout = null;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let audioCtx = null;

function ensureAudio() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  } catch(e) {}
}

function sound(freq1, freq2, length=0.24, gainMax=0.50, type="triangle") {
  try {
    ensureAudio();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.frequency.setValueAtTime(freq1, now);
    if (freq2 && freq2 !== freq1) {
      osc.frequency.exponentialRampToValueAtTime(freq2, now + length * 0.75);
    }

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(gainMax, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + length);

    osc.start(now);
    osc.stop(now + length + 0.04);
  } catch(e) {}
}

function soundGood() {
  sound(720, 980, .18, .42, "triangle");
  setTimeout(() => sound(980, 1320, .16, .42, "triangle"), 115);
  setTimeout(() => sound(1320, 1560, .14, .35, "triangle"), 230);
}

function soundBad() {
  // Mobilně slyšitelnější chyba: vyšší, ostrý, dvojitý sestupný tón.
  sound(620, 360, 0.22, 0.70, "square");
  setTimeout(() => sound(520, 260, 0.24, 0.70, "square"), 210);
}

function soundTick() {
  sound(520, 520, .05, .16, "sine");
}

function soundCheat() {
  sound(1400, 300, .30, .75, "sawtooth");
  setTimeout(() => sound(300, 1400, .30, .75, "sawtooth"), 300);
  setTimeout(() => sound(1400, 250, .42, .80, "sawtooth"), 620);
}

function soundEnd(pass) {
  pass ? soundGood() : soundBad();
}


function checkApplicationStatus() {
  return new Promise(resolve => {
    const callbackName = "stavAplikaceCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
    const script = document.createElement("script");
    let finished = false;

    function cleanup() {
      try { delete window[callbackName]; } catch(e) { window[callbackName] = undefined; }
      if (script && script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function(data) {
      if (finished) return;
      finished = true;
      cleanup();
      const stav = (data && data.stav ? String(data.stav) : "NEOVĚŘENO").trim().toUpperCase();
      resolve(stav);
    };

    script.onerror = function() {
      if (finished) return;
      finished = true;
      cleanup();
      resolve("NEOVĚŘENO");
    };

    const separator = WEB_APP_URL.includes("?") ? "&" : "?";
    script.src = WEB_APP_URL + separator + "action=status&callback=" + encodeURIComponent(callbackName) + "&t=" + Date.now();
    document.body.appendChild(script);

    setTimeout(() => {
      if (finished) return;
      finished = true;
      cleanup();
      resolve("NEOVĚŘENO");
    }, 4500);
  });
}

function showStartStatus(message, type) {
  const el = document.getElementById("startStatus");
  if (!el) return;
  el.textContent = message || "";
  el.className = type === "blocked" ? "blockedMessage" : (type === "checking" ? "checkingMessage" : "small center");
}

async function startQuiz() {
  ensureAudio();
  const surname = document.getElementById("surname").value.trim();
  const className = document.getElementById("className").value.trim();

  if (!surname || !className) {
    alert("Vyplň prosím příjmení i třídu.");
    return;
  }

  const startBtn = document.getElementById("startBtn");
  if (startBtn) startBtn.disabled = true;
  showStartStatus("Ověřuji, zda je aplikace spuštěna…", "checking");

  let stavAplikace = "NEOVĚŘENO";
  try {
    stavAplikace = await checkApplicationStatus();
  } catch(e) {
    stavAplikace = "NEOVĚŘENO";
  }

  if (stavAplikace === "ZABLOKOVÁNO" || stavAplikace === "ZABLOKOVANO") {
    showStartStatus("APLIKACI NELZE SPUSTIT – TEST JE DOČASNĚ ZABLOKOVÁN.", "blocked");
    if (startBtn) startBtn.disabled = false;
    return;
  }

  // Bezpečný režim: test se spustí pouze tehdy, když server výslovně vrátí SPUŠTĚNO.
  if (stavAplikace !== "SPUŠTĚNO" && stavAplikace !== "SPUSTENO") {
    showStartStatus("APLIKACI NELZE SPUSTIT – NEPODAŘILO SE OVĚŘIT JEJÍ STAV. ZKUSTE TO PROSÍM ZNOVU.", "blocked");
    if (startBtn) startBtn.disabled = false;
    return;
  }

  showStartStatus("", "");
  if (startBtn) startBtn.disabled = false;

  const sections = ["Adam a Eva", "Kain a Ábel", "Noe", "Babylonská věž", "Sodoma"];
  const selected = sections.flatMap(section =>
    shuffle(QUESTIONS.filter(item => item.cast === section)).slice(0, 3)
  );
  const selectedQuestions = new Set(selected.map(item => item.q));
  const extra = shuffle(QUESTIONS.filter(item => !selectedQuestions.has(item.q)))[0];
  quiz = shuffle([...selected, extra]).map(item => ({...item, a: shuffle(item.a)}));
  index = 0;
  points = 0;
  locked = false;
  started = true;
  finished = false;

  document.getElementById("screenStart").classList.add("hidden");
  document.getElementById("screenResult").classList.add("hidden");
  document.getElementById("screenQuiz").classList.remove("hidden");

  renderQuestion();
}

function renderQuestion() {
  if (document.activeElement && typeof document.activeElement.blur === "function") {
    document.activeElement.blur();
  }
  clearTimers();
  locked = false;
  timeLeft = QUESTION_TIME;

  const item = quiz[index];
  document.getElementById("progress").textContent = `Otázka ${index + 1}/${quiz.length}`;
  document.getElementById("score").textContent = `Body: ${points}`;
  document.getElementById("balladBadge").textContent = item.cast || "KYTICE";
  document.getElementById("question").textContent = item.q;
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  updateTimerDisplay();

  const box = document.getElementById("answers");
  box.innerHTML = "";

  item.a.forEach(ans => {
    const btn = document.createElement("button");
    btn.className = "answer";
    btn.textContent = ans;
    btn.style.pointerEvents = "auto";
    btn.onclick = () => chooseAnswer(btn, ans);
    box.appendChild(btn);
  });

  timerInterval = setInterval(() => {
    timeLeft -= 1;
    updateTimerDisplay();
    if (timeLeft <= 3 && timeLeft > 0) soundTick();
    if (timeLeft <= 0) {
      handleWrongOrTimeout();
    }
  }, 1000);
}

function updateTimerDisplay() {
  document.getElementById("timeText").textContent = `Čas: ${Math.max(0, timeLeft)} s`;
}

function chooseAnswer(btn, ans) {
  ensureAudio();
  if (locked || finished) return;
  locked = true;
  clearInterval(timerInterval);

  const item = quiz[index];
  const buttons = [...document.querySelectorAll(".answer")];
  buttons.forEach(b => b.disabled = true);

  if (ans === item.correct) {
    points++;
    btn.classList.add("correctReveal");
    document.getElementById("feedback").textContent = "SPRÁVNĚ";
    document.getElementById("feedback").className = "feedback good";
    document.getElementById("score").textContent = `Body: ${points}`;
    soundGood();
  } else {
    btn.classList.add("wrongReveal");
    const correctBtn = buttons.find(b => b.textContent === item.correct);
    if (correctBtn) correctBtn.classList.add("correctReveal");
    document.getElementById("feedback").textContent = "CHYBA";
    document.getElementById("feedback").className = "feedback bad";
    soundBad();
  }

  revealTimeout = setTimeout(nextQuestionAuto, REVEAL_TIME);
}

function handleWrongOrTimeout() {
  if (locked || finished) return;
  locked = true;
  clearInterval(timerInterval);

  const item = quiz[index];
  const buttons = [...document.querySelectorAll(".answer")];
  buttons.forEach(b => {
    b.disabled = true;
    if (b.textContent === item.correct) b.classList.add("correctReveal");
  });

  document.getElementById("feedback").textContent = "ČAS VYPRŠEL";
  document.getElementById("feedback").className = "feedback bad";
  soundBad();

  revealTimeout = setTimeout(nextQuestionAuto, REVEAL_TIME);
}

function nextQuestionAuto() {
  index++;
  if (index >= quiz.length) finishQuiz(false);
  else renderQuestion();
}

function clearTimers() {
  clearInterval(timerInterval);
  clearTimeout(revealTimeout);
}


function getGrade(score) {
  if (score >= 15) return "1";
  if (score >= 13) return "2";
  if (score >= 12) return "3";
  if (score >= 10) return "4";
  return "5";
}

function finishQuiz(byCheat) {
  if (finished) return;
  finished = true;
  started = false;
  clearTimers();
  clearTimeout(cheatTimer);

  const passed = !byCheat && points >= PASS_LIMIT;
  const grade = byCheat ? "6" : getGrade(points);
  const vysledekText = byCheat ? "neplatné" : (passed ? "USPĚL" : "NEUSPĚL");
  const znamka = byCheat ? "6" : grade;
  const note = byCheat
    ? "Test ukončen: opuštění okna aplikace / podezření na podvod."
    : (passed ? `Splněno. Známka: ${grade}.` : `Nesplněno. Známka: ${grade}.`);

  document.getElementById("screenQuiz").classList.add("hidden");
  document.getElementById("screenResult").classList.remove("hidden");
  document.getElementById("finalTitle").textContent = byCheat ? "TEST UKONČEN" : vysledekText;
  document.getElementById("finalText").innerHTML = byCheat
    ? `
      <div class="resultScore">
        <div class="resultLabel">ZÍSKANÉ BODY</div>
        <div class="resultValue">${points}/${quiz.length}</div>
      </div>
      <div class="resultScore">
        <div class="resultLabel">ZNÁMKA</div>
        <div class="resultGrade">6</div>
      </div>
      <p class="small">Aplikace zaznamenala opuštění testu.</p>
    `
    : `
      <div class="resultScore">
        <div class="resultLabel">ZÍSKANÉ BODY</div>
        <div class="resultValue">${points}/${quiz.length}</div>
      </div>
      <div class="resultScore">
        <div class="resultLabel">ZNÁMKA</div>
        <div class="resultGrade">${grade}</div>
      </div>
      <p class="small">Limit pro úspěch: ${PASS_LIMIT}/${TEST_COUNT}.</p>
    `;

  if (byCheat) {
    soundCheat();
  } else {
    soundEnd(passed);
  }
  sendResult(znamka, note, vysledekText);
}

function goMenu() {
  clearTimers();
  document.getElementById("screenQuiz").classList.add("hidden");
  document.getElementById("screenResult").classList.add("hidden");
  document.getElementById("screenStart").classList.remove("hidden");
  document.getElementById("surname").value = "";
  document.getElementById("className").value = "";
  document.getElementById("surname").focus();
}

function sendResult(znamka, note, vysledekText) {
  const status = document.getElementById("sendStatus");

  if (!WEB_APP_URL) {
    status.textContent = "Výsledek nebyl odeslán – v HTML je nutné doplnit URL Apps Scriptu.";
    return;
  }

  const data = new URLSearchParams();
  data.append("timestamp", new Date().toISOString());
  data.append("aplikace", APP_NAME);
  data.append("trida", document.getElementById("className").value.trim());
  data.append("prijmeni", document.getElementById("surname").value.trim());
  data.append("jmeno", document.getElementById("surname").value.trim());
  data.append("vysledek", vysledekText || znamka);
  data.append("znamka", znamka);
  data.append("body", String(points));
  data.append("celkem", String(quiz.length));
  data.append("spravne", String(points));
  data.append("spatne", String(quiz.length - points));
  data.append("rezim", note.includes("opuštění") ? "PŘEKLIKNUTÍ" : "TEST");
  data.append("poznamka", note);
  data.append("odeslano", new Date().toLocaleString("cs-CZ"));
  data.append("technika", "skryty_formular_iframe");

  // Ověřená cesta z funkční aplikace Malý princ:
  // skutečné formulářové odeslání do skrytého iframe.
  const iframeName = "odesilaci_iframe";
  let iframe = document.querySelector('iframe[name="' + iframeName + '"]');
  if (!iframe) {
    iframe = document.createElement("iframe");
    iframe.name = iframeName;
    iframe.style.display = "none";
    document.body.appendChild(iframe);
  }

  const form = document.createElement("form");
  form.method = "POST";
  form.action = WEB_APP_URL;
  form.target = iframeName;
  form.style.display = "none";

  for (const [key, value] of data.entries()) {
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = key;
    input.value = value;
    form.appendChild(input);
  }

  document.body.appendChild(form);
  form.submit();
  status.textContent = "Výsledek byl odeslán do tabulky.";
  setTimeout(() => form.remove(), 1500);
}

/*
  Ochrana proti překliknutí:
  - krátké omylem vyvolané rozostření nestačí;
  - test se ukončí až při skutečném skrytí stránky delším než 1,2 s.
*/
document.addEventListener("visibilitychange", () => {
  if (!started || finished) return;

  if (document.hidden) {
    cheatTimer = setTimeout(() => {
      if (started && !finished && document.hidden) finishQuiz(true);
    }, 1200);
  } else {
    clearTimeout(cheatTimer);
  }
});


const startBtnElement = document.getElementById("startBtn");
if (startBtnElement) {
  startBtnElement.addEventListener("click", startQuiz);
}

window.addEventListener("pagehide", () => {
  if (started && !finished) finishQuiz(true);
});
